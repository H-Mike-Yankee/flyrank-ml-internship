name: deploy-paper

# Publishes ONLY the paper/ folder to GitHub Pages — keeps the public site
# separate from internal reference docs (docs/, work/, data/). Deploys on
# every push to main. Set Pages source to "GitHub Actions" once (Settings ->
# Pages); after that every push to main redeploys the paper.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload paper
        uses: actions/upload-pages-artifact@v3
        with:
          path: paper

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4